name: FAQ example

on:
  push:
    branches: [main]
    paths: ['skills/infinite-faq/**', '.github/workflows/faq-example.yml']
  pull_request:
    paths: ['skills/infinite-faq/**', '.github/workflows/faq-example.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/infinite-faq/example
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/infinite-faq/example/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
