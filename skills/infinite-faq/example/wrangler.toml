name = "infinite-faq-example"
main = "src/index.tsx"
compatibility_date = "2026-09-01"
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false

[ai]
binding = "AI"

# Static files (the island bundle + CSS). Matched paths are served by the platform before
# the Worker runs; everything else reaches the Hono app.
[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true
